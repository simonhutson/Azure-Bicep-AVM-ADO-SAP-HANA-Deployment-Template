name: iac-ci-$(Date:yyyyMMdd).$(Rev:r)

trigger:
  batch: true
  branches:
    include:
      - main
  paths:
    include:
      - infra/*
      - pipelines/*
      - tests/*
      - azure-pipelines.yml
      - README.md

pr:
  branches:
    include:
      - main
  paths:
    include:
      - infra/*
      - pipelines/*
      - tests/*
      - azure-pipelines.yml
      - README.md

pool:
  vmImage: ubuntu-24.04

stages:
  - template: pipelines/templates/build.yml
